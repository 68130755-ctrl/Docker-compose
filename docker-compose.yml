version: '3.8'

services:
  ml_api:
    build: ./app
    container_name: phishing_detection_api
    restart: always

  web_server:
    image: nginx:alpine
    container_name: nginx_phishing_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ml_api
    restart: always